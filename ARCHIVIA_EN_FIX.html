.bd{position:absolute;left:70px;right:70px;top:175px;bottom:110px;font-size:30px;line-height:1.35}
.nav{position:absolute;left:0;right:0;bottom:0;height:90px;background:rgba(73,55,127,.96);display:flex;align-items:center;justify-content:center;gap:18px}
button{font:inherit;cursor:pointer}.nb{background:var(--yl);border:3px solid var(--nv);border-radius:40px;padding:8px 30px;font-size:26px;font-weight:800;color:var(--nv)}
.nb:hover,.btn:hover{filter:brightness(1.08)}.nb[disabled]{opacity:.35;cursor:default}.pn{color:#fff;font-size:28px;font-weight:700;min-width:120px;text-align:center}
.row{display:flex;gap:24px}.col{flex:1}.grid{display:grid;gap:20px}
.k,.box{background:#fff;border:4px solid var(--lv);border-radius:24px;padding:16px 22px}.k{cursor:pointer;transition:.15s}.k:hover{border-color:var(--dp);transform:translateY(-3px)}
.k b{display:block;color:var(--dp);font-size:30px}.k p{font-size:25px}.k .d{display:none;margin-top:8px;font-size:24px;background:var(--pk);border-radius:14px;padding:8px 12px}.k.o .d{display:block}.k.o{border-color:var(--dp);background:#fbf7ff}
.hint{font-size:21px;color:var(--dp);margin-top:6px;font-style:italic}
.blue{background:var(--sb);border-color:var(--nv)}.pink{background:var(--pk);border-color:var(--dp)}.yel{background:var(--yl);border-color:var(--nv)}
ul{padding-left:30px}li{margin:4px 0}h3{color:var(--dp);font-size:32px;margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:25px}th{background:var(--dp);color:#fff;padding:10px}td{padding:9px 12px;border:2px solid var(--lv);background:#fff}
.flow{display:flex;align-items:stretch;gap:10px}.flow>div{flex:1;background:var(--lv);border:3px solid var(--dp);border-radius:18px;padding:12px;text-align:center;font-weight:700;font-size:24px}.flow>i{align-self:center;font-style:normal;font-size:40px;color:var(--dp)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:3px solid var(--lv);border-radius:16px;padding:9px 18px;margin:7px 0;font-size:27px;color:var(--nv)}.opt:hover{border-color:var(--dp)}.opt.sel{background:var(--lv);border-color:var(--dp)}.opt.ok{background:#c9f1d2;border-color:#2e8b57}.opt.no{background:#ffd3d3;border-color:#c0392b}
.fb{margin-top:8px;padding:10px 16px;border-radius:14px;background:var(--yl);font-size:25px}
textarea{width:100%;height:150px;border:3px solid var(--lv);border-radius:14px;padding:10px;font:24px inherit;background:#fff;color:var(--nv);resize:none}

.tab{background:#fff;border:3px solid var(--dp);border-radius:30px;padding:6px 26px;font-size:26px;font-weight:800;color:var(--dp)}.tab.on{background:var(--dp);color:#fff}
#toc{position:absolute;inset:0;background:rgba(38,58,112,.95);display:none;z-index:9;padding:60px 120px}#toc.on{display:block}#toc h1{color:#fff;margin-bottom:20px}#toc .grid{grid-template-columns:repeat(3,1fr);gap:12px}#toc button{background:var(--cr);border:3px solid var(--yl);border-radius:16px;padding:10px 16px;font-size:26px;text-align:left;color:var(--nv)}
/* ===== Layout v2: 16:9 proportions, larger components, consistent spacing ===== */
:root{--gap:24px;--pad:20px 28px}
.hd{top:30px;gap:28px}
.tag{font-size:30px;padding:10px 30px}
h1{font-size:56px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.g{width:124px;height:124px;background-size:595px 335px;background-position:-107px -72px}
.bd{top:172px;bottom:108px;font-size:31px;line-height:1.35;display:flex;flex-direction:column;gap:var(--gap)}
.bd>*{min-height:0}
.nav{height:92px;gap:22px}
.nb{font-size:28px;padding:10px 34px}
.pn{font-size:30px;min-width:140px}
.row{gap:var(--gap)}.grid{gap:var(--gap)}
.k,.box{border-radius:26px;padding:var(--pad)}
.k{display:flex;flex-direction:column}
.k b{font-size:34px;margin-bottom:6px}
.k p{font-size:29px}
.k .d{font-size:27px;padding:14px 18px;margin-top:12px}
.k .cue{margin-top:auto;padding-top:10px;font-size:24px;color:var(--dp);font-style:italic;opacity:.85}
.k.o .cue{display:none}
.hint{font-size:25px;margin-top:0}
ul{padding-left:36px}li{margin:6px 0}
h3{font-size:38px;margin-bottom:10px}
.ic{font-size:72px}
.opt{font-size:30px;padding:14px 24px;margin:10px 0}
.fb{font-size:28px;padding:14px 20px;margin-top:12px}
.qq{font-size:36px;font-weight:700;margin:10px 0 14px;line-height:1.3}
#q8 .qq{font-size:31px}
#q14>b:first-child{font-size:30px}
.tab{font-size:30px;padding:8px 32px}
textarea{font-size:26px;padding:14px}
.btn{font-size:40px;padding:14px 56px}
.node{width:auto;flex:1;display:flex;align-items:center;gap:20px;text-align:left;padding:16px 24px;border-radius:26px}
.node .ic{font-size:60px}
.node b{font-size:36px;line-height:1.15}
.node span{font-size:28px;line-height:1.2;display:block}
.node small{display:block;font-size:23px;color:var(--dp);font-weight:700;margin-top:4px}
.flow{gap:12px}
.flow>div{font-size:28px;padding:16px 10px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;line-height:1.2}
.flow>div .ic{font-size:50px}
.flow>i{font-size:52px}
/* layout utilities */
.cc{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.f1{flex:1;min-width:0}
.dist{display:flex;flex-direction:column;justify-content:space-between}
.mid{display:flex;flex-direction:column;justify-content:center}
.ctr{text-align:center}
.nm{flex:none;width:54px;height:54px;border-radius:50%;background:var(--dp);color:#fff;font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center}
.sl{font-size:38px;font-weight:900;color:var(--dp);line-height:1.1}
.li{display:flex;align-items:center;gap:18px}
.li .ic{flex:none;width:60px;text-align:center}
.st{display:flex;align-items:center;gap:18px;background:#fff;border:3px solid var(--lv);border-radius:20px;padding:10px 22px;flex:1}
.chip{background:#fff;border:3px solid var(--lv);border-radius:20px;padding:10px 18px;display:flex;align-items:center;gap:14px}
.chip .ic{font-size:44px;flex:none}
.vs{align-self:center;flex:none;width:64px;height:64px;border-radius:50%;background:var(--dp);color:#fff;font-weight:900;font-size:34px;display:flex;align-items:center;justify-content:center}
.tl{display:flex;flex-direction:column;gap:14px;flex:1}
.fmt{display:flex;align-items:baseline;gap:12px;margin:5px 0;line-height:1.15}
.fmt b{font-size:28px;color:var(--dp);min-width:128px;flex:none}.fmt span{font-size:23px}
.idx{display:flex;align-items:stretch;gap:10px}

function mouseClick(t,v){const c=M.ctx,s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();
 s.buffer=M.noise;bp.type='bandpass';bp.frequency.value=3200;bp.Q.value=1.1;
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.024);
 s.connect(bp);bp.connect(g);g.connect(M.master);s.start(t,Math.random()*.5,.05);
 const o=c.createOscillator(),og=c.createGain();o.type='sine';o.frequency.setValueAtTime(210,t);o.frequency.exponentialRampToValueAtTime(80,t+.03);
 og.gain.setValueAtTime(v*.5,t);og.gain.exponentialRampToValueAtTime(.001,t+.035);o.connect(og);og.connect(M.master);o.start(t);o.stop(t+.05)}
function sfx(){const c=M.ctx;if(!c||!M.on)return;const t=c.currentTime+.003;mouseClick(t,.85);mouseClick(t+.075,.4)}
function tone(f1,f2,t,d,type,v){const c=M.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);if(f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(M.master);o.start(t);o.stop(t+d+.05)}
/* SUCCESS effect: small = correct answer, big = celebration animation */
function sfxWin(big,dl){const c=M.ctx;if(!c||!M.on)return;const t=c.currentTime+.003+(dl||0),n=big?[523,659,784,1047,1319]:[659,784,1047],st=big?.09:.08;
 n.forEach((f,i)=>{const tt=t+i*st;tone(f,f,tt,big?.45:.3,'triangle',.24);tone(f*2,f*2,tt,.24,'sine',.07)});
 if(big)[2093,2637,3136,3520].forEach((f,i)=>tone(f,f,t+.5+i*.07,.28,'sine',.06))}
/* efek SELESAI (slide terakhir): fanfare penutup — arpeggio naik lalu akord panjang + kilau */
function sfxDone(){const c=M.ctx;if(!c||!M.on)return;const t=c.currentTime+.003;
 [392,523,659,784].forEach((f,i)=>{tone(f,f,t+i*.11,.4,'triangle',.22);tone(f*2,f*2,t+i*.11,.2,'sine',.06)});
 const tc=t+.5;[523,659,784,1047].forEach(f=>{tone(f,f,tc,1.3,'triangle',.18);tone(f*2,f*2,tc,.9,'sine',.05)});
 [2093,2637,3136,3951,4186].forEach((f,i)=>tone(f,f,tc+.1+i*.08,.3,'sine',.055))}
/* RESULT effect: two soft bell tones (score not high enough for a big celebration) */
function sfxResult(dl){const c=M.ctx;if(!c||!M.on)return;const t=c.currentTime+.003+(dl||0);
 [[523,0],[659,.16]].forEach(x=>{tone(x[0],x[0],t+x[1],.5,'sine',.24);tone(x[0]*2,x[0]*2,t+x[1],.3,'sine',.06);tone(x[0]*3,x[0]*3,t+x[1],.18,'sine',.03)})}
/* click on a button / functional element → sound; click on empty area → silent */
addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('button,[onclick]');if(!el||el.closest('.mus')||el.classList.contains('opt')||el.hasAttribute('data-r'))return;sfx()},true);
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);S.style.transform=`scale(${k}) translate(-50%,-50%)`;}
addEventListener('resize',fit);fit();go(0);musStart();
</script></body></html>
